spring.application.name=bridge

spring.message.encoding=UTF-8
server.port=8200

server.internalPort=8100
server.internalPathPrefix=/internal/

server.adminPort=8000
server.adminPathPrefix=/admin/

# 必填：本地 IM 服务的管理地址和密钥。密钥不要使用示例值。
im.admin_url=${IM_ADMIN_URL:http://localhost:18080}
im.admin_secret=${IM_ADMIN_SECRET:}

# 必填：本域 ID，需在整个 mesh 内唯一
bridge.my_domain_id=${BRIDGE_MY_DOMAIN_ID:}
bridge.domain_divider=@

# 本方的对象存储服务地址是否公开(其他域可以直接访问)。如果非公开，发送带媒体文件的消息时需要先把文件传输到对方域
bridge.media_public_accessible=true

# 文件传输的超时时间(分钟)，包括从本方对象存储下载的读超时和上传到对方域的读写超时
bridge.file_transfer_timeout_minutes=10

# 文件传输的最大文件大小(MB)，0表示不限制。发送方下载和接收方上传都会限制
bridge.file_transfer_max_size_mb=100

# 文件传输的并发线程数(有界队列，队列满时直接失败)
bridge.file_transfer_threads=4

# 媒体下载主机白名单(逗号分隔)。为空时只允许 media.bucket_*_domain 中配置的本域桶地址；
# 对端传来的任意媒体 URL 默认拒绝，防止 SSRF。
bridge.media_download_host_whitelist=

# 是否允许从私网地址下载媒体。默认 false；只有在你明确信任目标内网媒体网关时才打开。
bridge.media_download_allow_private_hosts=false

# 单个 JSON 请求体上限(字节)，防止超大请求打满内存
bridge.max_request_body_bytes=2097152

# 请求签名时间窗(秒)，双向限制
bridge.signature_max_skew_seconds=300

# 调用 IM/对端接口的线程池，避免占用 ForkJoinPool.commonPool
bridge.api_threads=32
bridge.api_queue=1000

# 读取对端响应的最大字节数，防止恶意对端返回超大响应
bridge.http_response_max_bytes=1048576

# 管理后台会话超时(分钟)
bridge.session_timeout_minutes=60

# 是否允许管理端配置 http:// 的对端地址。生产环境应为 false，仅本地调试时临时打开。
bridge.allow_http_domains=false

# 管理后台允许的跨域来源(逗号分隔)，为空表示不启用 CORS
bridge.cors_allowed_origins=

# 首次启动创建管理员账号；密码至少 8 位，创建后请在后台更改密码
bridge.admin_account=admin
bridge.admin_init_password=${BRIDGE_ADMIN_INIT_PASSWORD:}

# 对象存储服务(minio)配置。必须配置。密钥不要使用示例值。
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access_key=${MINIO_ACCESS_KEY:}
minio.secret_key=${MINIO_SECRET_KEY:}

# 媒体文件按mediaType分桶存储，mediaType: 0通用 1图片 2语音 3视频 4文件 5头像 6收藏 7表情 8朋友圈
# bucket_name是对象存储里的桶名，bucket_domain是文件最终可访问的地址(对象存储前置的网关/CDN地址，不是用minio.endpoint拼接出来的)，返回给对方的文件地址为 bucket_domain + "/" + 文件名
media.bucket_general_name=media
media.bucket_general_domain=http://192.168.1.81/media
media.bucket_image_name=media
media.bucket_image_domain=http://192.168.1.81/media
media.bucket_voice_name=media
media.bucket_voice_domain=http://192.168.1.81/media
media.bucket_video_name=media
media.bucket_video_domain=http://192.168.1.81/media
media.bucket_file_name=media
media.bucket_file_domain=http://192.168.1.81/media
media.bucket_sticker_name=media
media.bucket_sticker_domain=http://192.168.1.81/media
media.bucket_moments_name=media
media.bucket_moments_domain=http://192.168.1.81/media
media.bucket_portrait_name=static
media.bucket_portrait_domain=http://192.168.1.81/static
media.bucket_favorite_name=static
media.bucket_favorite_domain=http://192.168.1.81/static


##*********************** mysql DB begin *************************
# 必填：数据库连接。使用独立的最小权限账号，生产环境启用 TLS。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bridge?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=true&requireSSL=true}
spring.datasource.username=${DB_USERNAME:bridge}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database=mysql
# 生产环境建议设为 validate，并使用 Flyway/Liquibase 管理表结构
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
##*********************** mysql DB end ***************************
